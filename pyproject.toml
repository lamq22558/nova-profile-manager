[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-profile-manager"
version = "9.0.0"
description = "Enterprise-grade Antidetect Browser Profile Manager with advanced fingerprinting, proxy management, automation, and cloud sync"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "NOVA Development Team", email = "dev@novanet.com"}
]
keywords = [
    "antidetect",
    "browser",
    "fingerprinting",
    "proxy",
    "automation",
    "profile-manager"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries",
    "Topic :: Internet"
]

[project.urls]
Homepage = "https://github.com/lamq22558/nova-profile-manager"
Documentation = "https://github.com/lamq22558/nova-profile-manager/docs"
Repository = "https://github.com/lamq22558/nova-profile-manager.git"
Issues = "https://github.com/lamq22558/nova-profile-manager/issues"

[tool.setuptools]
packages = ["nova"]

[tool.black]
line-length = 120
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip_gitignore = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
